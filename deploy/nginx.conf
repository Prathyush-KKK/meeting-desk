# Only used by deploy/Dockerfile.web (the split-origin option). The single-image deployment serves
# the SPA from the API itself and never loads this file.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable; index.html never is, or a deploy would not be picked up.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The SPA fallback: a deep link is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # There is no /metrics here. The API's metrics live on their own container port.
    location = /metrics {
        return 404;
    }
}
