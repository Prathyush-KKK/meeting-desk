{{- if .Values.externalSecrets.enabled }}
{{/*
External Secrets Operator pulls every secret env var from Infisical at /meeting-desk/<KEY>.
No value is in this repo, in this chart, or in the rendered manifest - only the path to it.
Rotating a key in Infisical is picked up within refreshInterval; the pods read it from the Secret
through envFrom, so a rotation needs a restart only for MEETING_DESK_TOKEN_KEY (see the README's
"Rotating the token key").
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "meeting-desk.secretName" . }}
  labels:
    {{- include "meeting-desk.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: {{ .Values.externalSecrets.secretStore.kind }}
  target:
    name: {{ include "meeting-desk.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecrets.keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ printf "%s/%s" $.Values.externalSecrets.basePath . }}
    {{- end }}
    {{- if and .Values.externalSecrets.rotation .Values.externalSecrets.rotation.enabled }}
    {{/* Only while a key rotation is in flight; see values.yaml. */}}
    - secretKey: {{ .Values.externalSecrets.rotation.key }}
      remoteRef:
        key: {{ printf "%s/%s" .Values.externalSecrets.basePath .Values.externalSecrets.rotation.key }}
    {{- end }}
{{- if .Values.externalSecrets.vertexServiceAccount.enabled }}
---
{{/*
The Vertex service account key is a file, not an env var: the Vertex SDK reads
GOOGLE_APPLICATION_CREDENTIALS. Its own ExternalSecret so it can be rotated on its own schedule.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "meeting-desk.vertexSecretName" . }}
  labels:
    {{- include "meeting-desk.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: {{ .Values.externalSecrets.secretStore.kind }}
  target:
    name: {{ include "meeting-desk.vertexSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.externalSecrets.vertexServiceAccount.fileName }}
      remoteRef:
        key: {{ printf "%s/%s" .Values.externalSecrets.basePath .Values.externalSecrets.vertexServiceAccount.key }}
{{- end }}
{{- end }}
