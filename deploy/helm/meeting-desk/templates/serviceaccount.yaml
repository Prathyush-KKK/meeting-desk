{{- if .Values.serviceAccount.create }}
{{/*
The Bedrock fallback authenticates through IRSA: annotate this service account with the role ARN
(serviceAccount.annotations) and the pods get AWS credentials with no key on disk. Vertex uses a
Google service account key file instead, because Workload Identity does not span clouds.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "meeting-desk.serviceAccountName" . }}
  labels:
    {{- include "meeting-desk.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
