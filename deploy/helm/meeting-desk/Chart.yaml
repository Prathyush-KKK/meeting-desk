apiVersion: v2
name: meeting-desk
description: >-
  Meeting Desk - meetings in, rows in a Google Sheet out. One image serves the API and the built
  SPA; a second Deployment runs the procrastinate worker (extraction, the Notes by Gemini re-check,
  token health).
type: application
# The chart's own version. Bump it on any template change.
