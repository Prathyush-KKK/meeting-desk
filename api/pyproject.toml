[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-desk-api"
version = "0.2.0"
description = "Meeting Desk API: turn meeting notes into action items and write them into Google Sheets"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  # Floor for the Range-header DoS fix in FileResponse (the SPA is served through StaticFiles).
  "starlette>=0.49.1",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.6",
  "alembic==1.20.1",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.2",
  # The Google clients are plain httpx against the REST endpoints (see app/google/http.py);
  # authlib runs sign-in and supplies PKCE for the connect flow, whose requests go through httpx
  # (app/google/oauth.py); cryptography (Fernet) keeps refresh tokens at rest.
  "httpx==0.28.1",
  "authlib==1.9.1",
  "cryptography>=46.0.0",
  "itsdangerous==2.2.0",
  "dateparser==1.4.3",
  "python-dateutil==2.9.0.post0",
  "psycopg[binary]==3.3.6",
  "psycopg-pool>=3.2",
  # 3.x: 2.15 cannot open its LISTEN connection with psycopg-pool 3.3, so the worker died on start.
  "procrastinate==3.10.0",
  # Telemetry per docs/TELEMETRY.md; /metrics on its own port.
  "prometheus-client==0.26.0",
]

[project.optional-dependencies]
# The model SDKs are only needed with FAKE_LLM=0 and are imported lazily. EXTRACTION_PROVIDER=openai
# (OpenAI, Ollama, OpenRouter, ...) needs none of them: it is plain httpx.
vertex = ["google-cloud-aiplatform==2.7.0"]
bedrock = ["boto3==1.43.121"]
anthropic = ["anthropic==2.3.0"]
llm = ["google-cloud-aiplatform==2.7.0", "boto3==1.43.121", "anthropic==2.3.0"]
dev = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.isort]
# api/alembic/ holds the migrations; the alembic library is still third-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Verbatim demo content; reflowing it would change the data.
"app/seed_data.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
