[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-desk-api"
version = "0.1.0"
description = "Meeting Desk backend - meetings, notes, points, sheets transfer"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  # The Google clients are plain httpx against the REST endpoints (see app/google/http.py);
  # authlib runs the OAuth flows; cryptography (Fernet) keeps refresh tokens at rest.
  "httpx==0.28.1",
  "authlib==1.4.0",
  "cryptography>=44.0.0",
  "itsdangerous==2.2.0",
  "dateparser==1.2.0",
  "python-dateutil==2.9.0.post0",
  "psycopg[binary]==3.2.3",
  "psycopg-pool>=3.2",
  "procrastinate==2.15.1",
  # Telemetry per docs/ALERT-EMISSION-STANDARD-SUMMARY.md; /metrics on its own port.
  "prometheus-client==0.21.1",
]

[project.optional-dependencies]
# The model SDKs are heavy and only needed with FAKE_LLM=0; both are imported lazily.
llm = [
  "google-cloud-aiplatform==1.75.0",
  "boto3==1.35.90",
]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.8.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Verbatim demo content lifted from the prototype's store.tsx; reflowing it would change the data.
"app/seed_data.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
