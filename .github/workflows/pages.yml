name: Pages

# Publishes site/ (the project's landing page) with the README's images to GitHub Pages.
# Enable it once under Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: [site/**, docs/images/**, web/public/favicon.svg, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/images
          cp -r site/. _site/
          cp docs/images/*.png _site/images/
          cp web/public/favicon.svg _site/favicon.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
