name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev,anthropic]"
      - run: ruff check .
      - run: python -m pytest -q

  web:
    name: Web (tsc, vitest, build, oxlint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: pnpm check
      - run: pnpm lint

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - run: helm lint deploy/helm/meeting-desk
      - run: helm lint deploy/helm/meeting-desk -f deploy/helm/meeting-desk/values-production.example.yaml
      - run: helm template meeting-desk deploy/helm/meeting-desk -f deploy/helm/meeting-desk/values-production.example.yaml > /dev/null

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: false
          load: true
          tags: meeting-desk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the demo configuration
        run: |
          docker run -d --name demo -p 8000:8000 \
            -e DATABASE_URL=sqlite:////tmp/meeting-desk.db -e AUTH_DEV_USER=daniel.okafor@example.com \
            -e METRICS_ENABLED=0 meeting-desk:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/healthz && break; sleep 2; done
          curl -fsS localhost:8000/auth/me
          curl -fsS localhost:8000/meetings/list > /dev/null
          curl -fsS localhost:8000/ | grep -q '<div id="root">'
          docker logs demo | tail -20
