name: Bug report
description: Something does not work the way the docs say it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run the demo (docker compose -f docker-compose.demo.yml up)
        2. Open Points on "Mobile roadmap review"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How you run it
      options:
        - Demo (fake Google, rule-based extraction)
        - Local with real Google (scripts/live.sh)
        - Docker image
        - Helm chart
        - Other
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: EXTRACTION_PROVIDER and model
      placeholder: "e.g. openai / gpt-4.1-mini, or fake"
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant JSON log lines. Remove anything private first - meeting content, emails, keys.
      render: shell
